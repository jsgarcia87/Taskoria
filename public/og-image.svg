<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f2e"/>
      <stop offset="1" stop-color="#0d0a14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <pattern id="tile" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="none"/>
      <rect x="0" y="0" width="48" height="48" fill="none" stroke="#2b1f4a" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#tile)"/>

  <!-- Left column: brand + tagline -->
  <g transform="translate(90, 130)">
    <text x="0" y="60" font-family="Impact, 'Arial Black', sans-serif" font-size="88" font-weight="900" fill="#ffffff" letter-spacing="-2">TASKORIA</text>
    <text x="0" y="150" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#ffffff">Turn your day into</text>
    <text x="0" y="210" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#facc15" font-style="italic">an RPG adventure.</text>
    <text x="0" y="290" font-family="Arial, sans-serif" font-size="22" fill="#c0b8d0">Habits &amp; tasks app with a real pixel-art world.</text>
    <text x="0" y="322" font-family="Arial, sans-serif" font-size="22" fill="#c0b8d0">Level up, explore, build the game together.</text>

    <!-- CTA badge -->
    <rect x="0" y="360" width="240" height="52" rx="26" fill="url(#gold)"/>
    <text x="120" y="393" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#130f1e" text-anchor="middle" letter-spacing="2">START THE ADVENTURE</text>

    <!-- URL -->
    <text x="0" y="450" font-family="'Courier New', monospace" font-size="18" fill="#8a7fa0" letter-spacing="2">TASKORIA.ES · CLOSED BETA</text>
  </g>

  <!-- Right column: pixel hero card mockup -->
  <g transform="translate(720, 110)">
    <!-- Card frame -->
    <rect x="0" y="0" width="400" height="410" rx="18" fill="#1e1732" stroke="#facc15" stroke-width="3" opacity="0.95"/>
    <rect x="0" y="0" width="400" height="42" rx="18" fill="#2b1f4a"/>
    <circle cx="22" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#facc15"/>
    <circle cx="62" cy="21" r="5" fill="#22c55e"/>
    <text x="380" y="27" font-family="'Courier New', monospace" font-size="12" fill="#8a7fa0" text-anchor="end">TASKORIA.ES/CAMP</text>

    <!-- XP badge -->
    <rect x="340" y="60" width="70" height="30" rx="15" fill="url(#gold)"/>
    <text x="375" y="80" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#130f1e" text-anchor="middle">+50 XP</text>

    <!-- Hero label -->
    <text x="30" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8a7fa0" letter-spacing="2">HERO</text>
    <text x="30" y="118" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffffff">Arcanys the Wise</text>
    <text x="30" y="140" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#a48be0" letter-spacing="1">LVL 7 · MAGE · ORDER OF EMBERS</text>

    <!-- Pixel character silhouette (simplified) -->
    <g transform="translate(90, 170)">
      <!-- Robe -->
      <rect x="20" y="70" width="80" height="80" fill="#4a2f7a"/>
      <rect x="20" y="70" width="80" height="8" fill="#6b46c1"/>
      <!-- Head -->
      <rect x="35" y="20" width="50" height="50" fill="#ffdbac"/>
      <!-- Hair -->
      <rect x="30" y="10" width="60" height="20" fill="#7c3aed"/>
      <rect x="30" y="20" width="10" height="20" fill="#7c3aed"/>
      <rect x="80" y="20" width="10" height="20" fill="#7c3aed"/>
      <!-- Eyes -->
      <rect x="45" y="40" width="6" height="6" fill="#000"/>
      <rect x="69" y="40" width="6" height="6" fill="#000"/>
      <!-- Staff -->
      <rect x="110" y="30" width="8" height="120" fill="#78350f"/>
      <circle cx="114" cy="30" r="10" fill="#facc15"/>
    </g>

    <!-- HP/MP/XP bars -->
    <g transform="translate(30, 335)">
      <rect x="0" y="0" width="340" height="8" rx="4" fill="#2b1f4a"/>
      <rect x="0" y="0" width="260" height="8" rx="4" fill="#ef4444"/>
      <rect x="0" y="16" width="340" height="8" rx="4" fill="#2b1f4a"/>
      <rect x="0" y="16" width="200" height="8" rx="4" fill="#3b82f6"/>
      <rect x="0" y="32" width="340" height="8" rx="4" fill="#2b1f4a"/>
      <rect x="0" y="32" width="140" height="8" rx="4" fill="#facc15"/>
    </g>
  </g>
</svg>
