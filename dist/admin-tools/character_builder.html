<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Forja de Clases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;600;700&family=Inter:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14181b;
  --panel:#1c2226;
  --panel-2:#232a2f;
  --sunken:#101416;
  --border:#39434a;
  --border-soft:#2a3237;
  --text:#edf1f3;
  --muted:#8f9ba1;
  --muted-2:#657178;
  --accent:#d86d50;
  --accent-hover:#c25a3f;
  --accent-soft:rgba(216,109,80,.16);
  --ok:#5fb37c;
  --ok-soft:rgba(95,179,124,.15);
  --warn:#e0b23d;
  --warn-soft:rgba(224,178,61,.15);
  --danger:#e2604a;
  --danger-soft:rgba(226,96,74,.15);
  --font-display:'Handjet','Press Start 2P',monospace;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'VT323','SFMono-Regular',monospace;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:13px;
  line-height:1.45;
  min-height:100vh;
}
::selection{background:var(--accent-soft);}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
h1,h2,h3{text-wrap:balance;margin:0;}
.hidden{display:none!important;}

/* ---------- layout shell ---------- */
#app{display:flex;flex-direction:column;min-height:100vh;}

.topbar{
  display:flex;align-items:center;gap:20px;
  padding:10px 18px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.wordmark{
  font-family:var(--font-display);
  font-size:18px;
  font-weight:700;
  letter-spacing:1.5px;
  color:var(--accent);
  white-space:nowrap;
}
.wordmark span{color:var(--muted);}
.mode-switch{display:flex;gap:4px;background:var(--sunken);border:1px solid var(--border);border-radius:8px;padding:3px;}
.mode-switch button{
  appearance:none;border:none;background:transparent;color:var(--muted);
  font-weight:600;font-size:12.5px;padding:8px 16px;border-radius:6px;cursor:pointer;
  transition:background .12s,color .12s;
}
.mode-switch button.active{background:var(--accent);color:#1a0e0a;}
.mode-switch button:not(.active):hover{color:var(--text);background:var(--panel-2);}
.topbar-spacer{flex:1;}
.draft-status{font-size:11px;color:var(--muted-2);font-family:var(--font-mono);display:flex;align-items:center;gap:8px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;}
.btn-ghost{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:7px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--text);}
.btn-save{
  background:var(--accent);color:#1a0e0a;border:none;
  padding:8px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:5px;white-space:nowrap;
  transition:background .12s,transform .1s;
}
.btn-save:hover{background:var(--accent-hover);}
.btn-save:active{transform:scale(.97);}
.btn-publish{
  background:var(--ok);color:#0a1a0e;border:none;
  padding:8px 14px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:5px;white-space:nowrap;
  transition:background .12s,transform .1s;
}
.btn-publish:hover{background:#4a9a66;}
.btn-publish:active{transform:scale(.97);}
.btn-publish:disabled,.btn-save:disabled{opacity:.5;cursor:not-allowed;}
.btn-publish.publishing{animation:pulse-pub .8s ease-in-out infinite;}
@keyframes pulse-pub{0%,100%{opacity:1;}50%{opacity:.6;}}

.config-row{display:flex;align-items:center;gap:8px;margin-left:6px;}
.config-row input{
  background:var(--sunken);border:1px solid var(--border);color:var(--text);
  padding:5px 8px;border-radius:5px;font-size:11px;font-family:var(--font-mono);width:50px;
}
.config-row label{font-size:10px;color:var(--muted-2);white-space:nowrap;}

.workspace{display:flex;flex:1;min-height:0;}
.rail{background:var(--panel);overflow-y:auto;}
.rail-left{width:290px;border-right:1px solid var(--border);flex-shrink:0;}
.rail-right{width:310px;border-left:1px solid var(--border);flex-shrink:0;}
.center{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}

.rail-section{padding:14px 14px;border-bottom:1px solid var(--border-soft);}
.rail-section h3{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);
  margin:0 0 10px 0;font-weight:600;
}
.rail-hint{font-size:11.5px;color:var(--muted);margin:0 0 10px 0;}

/* ---------- roster (class constructor left rail) ---------- */
.roster-card{
  display:flex;flex-direction:column;gap:4px;
  padding:9px 10px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;margin-bottom:5px;background:var(--panel-2);
}
.roster-card:hover{border-color:var(--border);}
.roster-card.active{border-color:var(--accent);background:var(--accent-soft);}
.roster-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.roster-name{font-weight:600;font-size:12.5px;}
.roster-silhouette{font-size:11px;color:var(--muted);}
.chip{
  font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 6px;border-radius:99px;white-space:nowrap;
}
.chip-built{background:var(--ok-soft);color:var(--ok);}
.chip-pending{background:var(--panel);color:var(--muted-2);border:1px solid var(--border);}

/* ---------- cosmetic option cards ---------- */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.opt-card{
  border:1px solid var(--border);background:var(--panel-2);border-radius:7px;
  padding:8px 8px;text-align:center;cursor:pointer;font-size:11.5px;font-weight:500;color:var(--muted);
}
.opt-card.active{border-color:var(--accent);color:var(--text);background:var(--accent-soft);}
.opt-card:hover{color:var(--text);}
.opt-list{display:flex;flex-direction:column;gap:6px;}
.opt-row{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1px solid var(--border);background:var(--panel-2);border-radius:7px;
  padding:7px 10px;cursor:pointer;font-size:11.5px;color:var(--muted);
}
.opt-row.active{border-color:var(--accent);color:var(--text);background:var(--accent-soft);}

select{
  width:100%;background:var(--sunken);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:8px 9px;font-size:12px;
}
input[type=text],textarea{
  width:100%;background:var(--sunken);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:8px 9px;font-size:12px;resize:vertical;
}
label.field-label{display:block;font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px;font-weight:600;}
label.field-label:first-child{margin-top:0;}

/* ---------- center: toolbar + canvas ---------- */
.toolbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);
}
.tool-group{display:flex;gap:3px;background:var(--sunken);border:1px solid var(--border);border-radius:7px;padding:3px;}
.tool-btn{
  appearance:none;border:none;background:transparent;color:var(--muted);
  padding:7px 10px;border-radius:5px;cursor:pointer;font-size:11.5px;font-weight:600;
}
.tool-btn.active{background:var(--accent);color:#1a0e0a;}
.tool-btn:not(.active):hover{color:var(--text);}
.toolbar-sep{width:1px;height:22px;background:var(--border);margin:0 3px;}
.toolbar label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;}
.toolbar input[type=range]{width:70px;accent-color:var(--accent);}
.toolbar input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;}
.stepper{display:flex;align-items:center;gap:2px;background:var(--sunken);border:1px solid var(--border);border-radius:6px;padding:2px;}
.stepper button{width:22px;height:22px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:4px;font-size:13px;}
.stepper button:hover{background:var(--panel-2);color:var(--text);}
.stepper span{font-family:var(--font-mono);font-size:11.5px;width:16px;text-align:center;}

.canvas-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:24px;position:relative;}
.canvas-stack{position:relative;box-shadow:0 0 0 1px var(--border),0 12px 32px rgba(0,0,0,.4);}
canvas{display:block;image-rendering:pixelated;cursor:crosshair;}

.layerstrip{
  display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--border);
  background:var(--panel);flex-wrap:wrap;
}
.layerstrip-label{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-right:2px;}
.layer-chip{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--border);background:var(--panel-2);border-radius:7px;
  padding:6px 10px;cursor:pointer;font-size:11.5px;color:var(--muted);
}
.layer-chip.active{border-color:var(--accent);color:var(--text);background:var(--accent-soft);}
.layer-chip .swatch-mini{width:9px;height:9px;border-radius:2px;background:var(--muted-2);}
.layer-chip.has-content .swatch-mini{background:var(--accent);}
.layer-chip.layer-hidden{opacity:.5;}
.layer-chip.layer-hidden .swatch-mini{background:var(--muted-2)!important;}
.layer-vis-btn{
  display:flex;align-items:center;justify-content:center;
  width:18px;height:18px;padding:0;border:none;border-radius:4px;
  background:transparent;color:var(--muted-2);cursor:pointer;flex-shrink:0;
}
.layer-vis-btn:hover{background:var(--panel);color:var(--text);}
.add-slot{border-style:dashed;color:var(--muted-2);}

.metabar{
  display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--border);background:var(--panel);
  flex-wrap:wrap;align-items:flex-end;
}
.metabar .field{flex:1;min-width:160px;}
.metabar label.field-label{margin:0 0 4px;}

/* ---------- right rail: palette / ramp / validator / export ---------- */
.active-color-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.active-color-swatch{
  width:38px;height:38px;border-radius:8px;border:2px solid var(--border);flex-shrink:0;
  background-image:linear-gradient(45deg,#333 25%,transparent 25%),linear-gradient(-45deg,#333 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#333 75%),linear-gradient(-45deg,transparent 75%,#333 75%);
  background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0;background-color:#555;
}
.active-color-swatch .fill{width:100%;height:100%;border-radius:6px;}
.swatch-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;}
.swatch{
  aspect-ratio:1;border-radius:5px;border:1px solid rgba(0,0,0,.35);cursor:pointer;position:relative;
}
.swatch.selected{outline:2px solid var(--accent);outline-offset:1px;}
.color-input-row{display:flex;gap:6px;margin-top:8px;}
.color-input-row input[type=text]{font-family:var(--font-mono);text-transform:lowercase;}
.color-input-row input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer;}

.ramp-row{display:flex;gap:8px;align-items:center;}
.ramp-swatch{display:flex;flex-direction:column;align-items:center;gap:4px;}
.ramp-swatch input[type=color]{width:100%;height:30px;border:1px solid var(--border);border-radius:6px;padding:0;background:none;cursor:pointer;}
.ramp-swatch span{font-size:9.5px;color:var(--muted-2);font-weight:700;}
.ramp-preview{display:flex;height:16px;border-radius:4px;overflow:hidden;margin-top:8px;border:1px solid var(--border);}
.ramp-preview div{flex:1;}

.check-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
.check-row:last-child{border-bottom:none;}
.check-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.check-dot.pass{background:var(--ok);}
.check-dot.warn{background:var(--warn);}
.check-dot.fail{background:var(--danger);}
.check-body b{display:block;font-size:11.5px;margin-bottom:2px;}
.check-body span{font-size:11px;color:var(--muted);}

.export-btn{
  width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  padding:9px 11px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;margin-bottom:6px;
}
.export-btn:hover{border-color:var(--accent);}
.export-btn .arrow{color:var(--muted-2);font-family:var(--font-mono);}
.export-btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0e0a;font-weight:700;}
.export-btn.primary .arrow{color:#1a0e0a;}

.import-box{display:flex;flex-direction:column;gap:6px;}
.import-box textarea{height:70px;font-family:var(--font-mono);font-size:10.5px;}
.import-row{display:flex;gap:6px;}
.import-row select{flex:1;}
.small-btn{background:var(--panel-2);border:1px solid var(--border);color:var(--muted);padding:7px 10px;border-radius:6px;font-size:11px;cursor:pointer;white-space:nowrap;}
.small-btn:hover{color:var(--text);border-color:var(--accent);}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:8px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.scrollbar-thin::-webkit-scrollbar{width:8px;height:8px;}
.scrollbar-thin::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.rail{scrollbar-color:var(--border) transparent;scrollbar-width:thin;}

/* ---------- bottom nav (mobile/tablet) ---------- */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--panel);border-top:1px solid var(--border);
  padding:4px 0 env(safe-area-inset-bottom,4px);
}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:stretch;}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;color:var(--muted);padding:8px 4px;
  font-family:var(--font-body);font-size:10px;font-weight:600;cursor:pointer;
  transition:color .12s;
}
.bnav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.bnav-btn.active{color:var(--accent);}
.bnav-btn:not(.active):active{color:var(--text);}

/* ---------- mobile panel overlay ---------- */
.mobile-panel{
  position:fixed;bottom:52px;left:0;right:0;z-index:35;
  background:var(--panel);border-top:1px solid var(--border);
  max-height:55vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .2s ease;
  box-shadow:0 -8px 32px rgba(0,0,0,.4);
  scrollbar-color:var(--border) transparent;scrollbar-width:thin;
  pointer-events:none;visibility:hidden;
}
.mobile-panel.open{transform:translateY(0);pointer-events:auto;visibility:visible;}
.mobile-panel .rail-section:last-child{padding-bottom:12px;}

/* ---------- settings drawer ---------- */
.settings-drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(320px,85vw);z-index:50;
  background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;
  transform:translateX(100%);transition:transform .22s ease;
  box-shadow:-8px 0 32px rgba(0,0,0,.4);
  pointer-events:none;visibility:hidden;
}
.settings-drawer.open{transform:translateX(0);pointer-events:auto;visibility:visible;}
.settings-overlay{
  position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.settings-overlay.open{opacity:1;pointer-events:auto;}
.settings-drawer .rail-section{padding:16px;}
.settings-drawer h3{margin-bottom:12px;}
.settings-close{
  position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--border);z-index:1;
}
.settings-close button{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;
}
.settings-close button:hover{color:var(--text);border-color:var(--accent);}

/* ---------- toolbar compact mode ---------- */
.toolbar-advanced{display:contents;}

/* ---------- topbar gear button ---------- */
.btn-gear{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  width:34px;height:34px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.btn-gear:hover{border-color:var(--accent);color:var(--text);}
.btn-gear svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ========== TABLET ========== */
@media (max-width:980px){
  .workspace{flex-direction:column;}
  .rail-left,.rail-right{width:auto;border:none;border-bottom:1px solid var(--border);}
  .rail-left{max-height:220px;}
  .rail-right{max-height:none;}
  .topbar{gap:10px;padding:8px 12px;}
  .mode-switch button{padding:6px 12px;font-size:11.5px;}
  .toolbar{padding:8px 12px;gap:4px;}
  .tool-btn{padding:6px 8px;font-size:11px;}
  .config-row{display:none;}
  .draft-status span:not(.dot){display:none;}
}

/* ========== MOBILE ========== */
@media (max-width:640px){
  body{padding-bottom:56px;}
  .bottom-nav{display:block;}
  .mobile-panel{display:block;}

  /* topbar compact */
  .topbar{
    gap:8px;padding:8px 10px;
    position:sticky;top:0;z-index:30;
  }
  .wordmark{font-size:14px;letter-spacing:1px;}
  .wordmark span{display:none;}
  .mode-switch{display:none;}
  .topbar-spacer{display:none;}
  .draft-status{display:none;}
  .config-row{display:none !important;}
  .btn-ghost#btnNewProject{display:none;}
  .btn-save,.btn-publish{padding:7px 10px;font-size:11px;}
  .btn-save span.btn-label,.btn-publish span.btn-label{display:none;}

  /* workspace single column */
  .workspace{flex-direction:column;}
  .rail-left,.rail-right{display:none;}

  /* toolbar compact */
  .toolbar{
    padding:6px 8px;gap:4px;overflow-x:auto;flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .tool-group{flex-shrink:0;}
  .tool-btn{padding:8px 8px;font-size:10.5px;white-space:nowrap;}
  .toolbar-sep{margin:0 1px;height:18px;}
  .toolbar label{font-size:10.5px;}
  .toolbar input[type=range]{width:50px;}
  .toolbar select{font-size:10.5px;padding:6px 4px;}
  .toolbar-advanced{display:none;}

  /* canvas full width */
  .canvas-area{padding:8px;min-height:0;}
  .center{min-height:0;}

  /* layer strip compact */
  .layerstrip{padding:6px 8px;gap:5px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
  .layerstrip::-webkit-scrollbar{display:none;}
  .layer-chip{padding:5px 8px;font-size:10.5px;white-space:nowrap;flex-shrink:0;}
  .layerstrip-label{display:none;}

  /* metabar compact */
  .metabar{padding:8px;gap:6px;}
  .metabar .field{min-width:0;}

  /* touch friendly swatches */
  .swatch-grid{grid-template-columns:repeat(8,1fr);gap:4px;}
  .swatch{min-width:28px;min-height:28px;}

  /* roster cards touch-friendly */
  .roster-card{padding:12px;margin-bottom:6px;}
  .roster-name{font-size:13px;}
  .roster-silhouette{font-size:12px;line-height:1.35;}
  .rail-hint{display:none;}

  /* toast above bottom nav */
  .toast{bottom:70px;}
}
</style>

<div id="app">
  <div class="topbar">
    <div class="wordmark">TASKORIA <span>· FORJA DE CLASES</span></div>
    <div class="mode-switch">
      <button id="tab-clases" class="active">Clases</button>
      <button id="tab-cosmeticos">Cosméticos</button>
    </div>
    <div class="topbar-spacer"></div>
    <div class="draft-status"><span class="dot" id="draftDot"></span><span id="draftLabel">sesión guardada</span></div>
    <div class="config-row">
      <label>Admin ID</label>
      <input type="text" id="cfgAdminId" placeholder="ID" title="Tu ID de usuario admin en Taskoria"/>
    </div>
    <button class="btn-ghost" id="btnNewProject">+ Clase</button>
    <button class="btn-save" id="btnSaveSession">&#128190; <span class="btn-label">Guardar</span></button>

/* ---------- helpers ---------- */

function decodePacked(key){
  const p = PACKED_ASSETS[key];
  if(!p) return new Array(4096).fill(null);
  const out = new Array(4096);
  for(let i=0;i<4096;i++){
    const ch = p.data[i];
    out[i] = ch === '.' ? null : (p.legend[ch] || null);
  }
  return out;
}
function blankLayer(){ return new Array(4096).fill(null); }
function cloneLayer(arr){ return arr.slice(); }

function hexToRgb(hex){
  const h = hex.replace('#','');
  return { r:parseInt(h.substr(0,2),16), g:parseInt(h.substr(2,2),16), b:parseInt(h.substr(4,2),16) };
}
function rgbDist(a,b){
  const A=hexToRgb(a), B=hexToRgb(b);
  return Math.sqrt((A.r-B.r)**2 + (A.g-B.g)**2 + (A.b-B.b)**2);
}
function idx(x,y){ return y*64+x; }

/* ---------- API config ---------- */

const API_BASE = 'https://taskoria.es/api';

function getAdminId(){
  return document.getElementById('cfgAdminId')?.value?.trim() || localStorage.getItem('forja_admin_id') || '';
}

function downloadJSON(obj, filename){
  const text = JSON.stringify(obj, null, 2);
  const blob = new Blob([text], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  toast('Descargado: '+filename);
}
function copyText(str){
  navigator.clipboard && navigator.clipboard.writeText(str).catch(()=>{});
}
let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---------- import format detection ---------- */

function parseImportedAsset(text){
  const data = JSON.parse(text);
  if (data && Array.isArray(data.current) && data.current.length===4096){
    return data.current.map(v => v==='transparent' ? null : v.toLowerCase());
  }
  // baked {name:{paleta,blueprint}} format
  const inner = data && typeof data === 'object' ? Object.values(data)[0] : null;
  if (inner && inner.paleta && Array.isArray(inner.blueprint)){
    const paleta = inner.paleta;
    const flat = [];
    for(const row of inner.blueprint){
      for(const ch of row){
        const hex = paleta[ch];
        flat.push((!hex || hex==='transparent') ? null : hex.toLowerCase());
      }
    }
    if(flat.length===4096) return flat;
  }
  // full baked payload {payload:{paleta,blueprint}}
  if (data && data.payload && data.payload.paleta && Array.isArray(data.payload.blueprint)){
    const paleta = data.payload.paleta;
    const flat = [];
    for(const row of data.payload.blueprint){
      for(const ch of row){
        const hex = paleta[ch];
        flat.push((!hex || hex==='transparent') ? null : hex.toLowerCase());
      }
    }
    if(flat.length===4096) return flat;
  }
  throw new Error('Formato no reconocido');
}

/* ---------- state ---------- */

const projectsByClassId = {}; // classId -> project

function newProjectFor(classId){
  const meta = ROSTER_BY_ID[classId] || { id:classId, name:classId, desc:'', silhouette:'' };
  const layers = {};
  const activeSlots = CLASS_ASSETS[classId] ? Object.keys(CLASS_ASSETS[classId]) : CORE_SLOTS.slice();
  for(const slot of activeSlots){
    const assetKey = CLASS_ASSETS[classId] && CLASS_ASSETS[classId][slot];
    layers[slot] = assetKey ? cloneLayer(decodePacked(assetKey)) : blankLayer();
  }
  return {
    classId, className: meta.name, classDesc: meta.desc, classSilhouette: meta.silhouette,
    isCustom: !ROSTER_BY_ID[classId],
    activeSlots,
    layers,
    customSlotLabels: {},
    hiddenSlots: [],
    ramp: { enabled:false, B:'#000000', C:'#000000', D:'#000000' },
    gender: 'male',
    armPose: 'relajados',
    hairId: 'pelo_m1',
    customHair: null,
  };
}

function slotLabel(proj, slot){
  if(SLOT_DEFS[slot]) return SLOT_DEFS[slot].label;
  if(proj.customSlotLabels && proj.customSlotLabels[slot]) return proj.customSlotLabels[slot];
  return slot;
}

function effectiveZOrder(proj){
  const armaIdx = Z_ORDER.indexOf('arma');
  const custom = (proj.activeSlots||[]).filter(s=>!Z_ORDER.includes(s));
  return [...Z_ORDER.slice(0,armaIdx), ...custom, ...Z_ORDER.slice(armaIdx)];
}

function getOrCreateProject(classId){
  if(!projectsByClassId[classId]) projectsByClassId[classId] = newProjectFor(classId);
  return projectsByClassId[classId];
}

function isClassModified(classId) {
  const p = projectsByClassId[classId];
  if(!p) return ROSTER_BY_ID[classId] ? ROSTER_BY_ID[classId].built : false;
  
  // check if any layer has different pixels than the template
  for (const slot of p.activeSlots) {
    const assetKey = CLASS_ASSETS[classId] && CLASS_ASSETS[classId][slot];
    const templateArr = assetKey ? decodePacked(assetKey) : blankLayer();
    const currentArr = p.layers[slot];
    if(!currentArr) continue;
    for (let i=0; i<4096; i++) {
      if (currentArr[i] !== templateArr[i]) return true; // modified!
    }
  }
  // fallback to initial built status if not modified
  return ROSTER_BY_ID[classId] ? ROSTER_BY_ID[classId].built : false;
}

const state = {
  mode:'clases',
  classId:'wizard',
  editClassId:'wizard',
  activeLayerKey:'capucha',
  tool:'brush',
  brushSize:1,
  mirrorX:false,
  activeColor:'#000000',
  showGrid:true,
  showBBox:true,
  calco:{ on:false, opacity:0.3 },
  ghost:{ on:false, refClassId:'wizard' },
  zoom:10,
  palette: DEFAULT_PALETTE.slice(),
  // cosmetic-mode-only fields (kept globally, shared across classes for now)
  cosmeticClassId:'wizard',
  history:{}, // key = classId+'::'+slot -> {undo:[],redo:[]}
};

function project(){ return getOrCreateProject(state.classId); }
function histKey(){ return state.classId+'::'+state.activeLayerKey; }
function ensureHist(){
  const k = histKey();
  if(!state.history[k]) state.history[k] = { undo:[], redo:[] };
  return state.history[k];
}

/* ---------- layer resolution for compositing ---------- */

function resolveLayer(slotKey, proj, opts){
  opts = opts||{};
  if(slotKey==='cuerpo_base') return decodePacked(BASE_ASSET_MAP[opts.gender || proj.gender]);
  if(slotKey==='brazos') return decodePacked(ARM_ASSET_MAP[opts.armPose || proj.armPose]);
  if(slotKey==='pelo'){
    const hairId = opts.hairId !== undefined ? opts.hairId : proj.hairId;
    if(hairId==='ninguno') return blankLayer();
    if(hairId==='custom') return proj.customHair || blankLayer();
    return decodePacked(HAIR_ASSET_MAP[hairId]);
  }
  return (proj.layers && proj.layers[slotKey]) || null;
}

function occupancyMask(proj){
  const mask = new Array(4096).fill(false);
  for(const slot of proj.activeSlots||[]){
    const arr = proj.layers && proj.layers[slot];
    if(!arr) continue;
    for(let i=0;i<4096;i++) if(arr[i]) mask[i]=true;
  }
  return mask;
}

/* ---------- canvas rendering ---------- */

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

function currentCell(){ return state.zoom; }

function resizeCanvas(){
  const cell = currentCell();
  canvas.width = 64*cell;
  canvas.height = 64*cell;
}

function drawCheckerboard(){
  const cell = currentCell();
  const s = Math.max(4, Math.floor(cell/2));
  for(let y=0;y<canvas.height;y+=s){
    for(let x=0;x<canvas.width;x+=s){
      const on = ((x/s + y/s) % 2) === 0;
      ctx.fillStyle = on ? '#20262a' : '#181d20';
      ctx.fillRect(x,y,s,s);
    }
  }
}

function drawLayerArray(arr, cell, alpha){
  ctx.globalAlpha = alpha===undefined?1:alpha;
  for(let y=0;y<64;y++){
    for(let x=0;x<64;x++){
      const c = arr[idx(x,y)];
      if(!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(x*cell, y*cell, cell, cell);
    }
  }
  ctx.globalAlpha = 1;
}

function drawGuides(cell){
  ctx.save();
  ctx.strokeStyle = 'rgba(216,109,80,.55)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,2]);
  // head circle-ish box: center(32,19) r5
  ctx.strokeRect(27*cell, 14*cell, 10*cell, 10*cell);
  // torso: rect(26,29,12,14)
  ctx.strokeRect(26*cell, 29*cell, 12*cell, 14*cell);
  // legs
  ctx.strokeRect(27*cell, 42*cell, 4*cell, 12*cell);
  ctx.strokeRect(33*cell, 42*cell, 4*cell, 12*cell);
  ctx.restore();
}

function drawGrid(cell){
  if(cell<4) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.lineWidth = 1;
  for(let i=0;i<=64;i++){
    ctx.beginPath(); ctx.moveTo(i*cell+.5,0); ctx.lineTo(i*cell+.5,64*cell); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*cell+.5); ctx.lineTo(64*cell,i*cell+.5); ctx.stroke();
  }
  // center axis for mirror
  if(state.mirrorX){
    ctx.strokeStyle = 'rgba(216,109,80,.5)';
    ctx.beginPath(); ctx.moveTo(32*cell+.5,0); ctx.lineTo(32*cell+.5,64*cell); ctx.stroke();
  }
  ctx.restore();
}

function render(){
  resizeCanvas();
  const cell = currentCell();
  drawCheckerboard();

  const proj = project();

  // ghost reference: full composite of reference class over default body, low opacity
  if(state.ghost.on){
    const refProj = getOrCreateProject(state.ghost.refClassId);
    for(const slot of effectiveZOrder(refProj)){
      const arr = resolveLayer(slot, refProj, {});
      if(arr) drawLayerArray(arr, cell, 0.22);
    }
  }

  const zOrder = effectiveZOrder(proj);
  const isHidden = (slot)=> (proj.hiddenSlots||[]).includes(slot);

  if(state.mode==='clases' && state.calco.on){
    // isolate active layer: dim everything except cuerpo_base + active slot
    for(const slot of zOrder){
      if(slot===state.activeLayerKey){ continue; }
      if(isEquipmentSlot(slot) && isHidden(slot)) continue;
      const isBase = slot==='cuerpo_base';
      const arr = resolveLayer(slot, proj);
      if(arr) drawLayerArray(arr, cell, isBase ? 0.9 : state.calco.opacity);
    }
    const activeArr = resolveLayer(state.activeLayerKey, proj);
    if(activeArr) drawLayerArray(activeArr, cell, 1);
  } else {
    for(const slot of zOrder){
      if(isEquipmentSlot(slot) && isHidden(slot)) continue;
      const arr = resolveLayer(slot, proj);
      if(arr) drawLayerArray(arr, cell, 1);
    }
  }

  if(state.showBBox) drawGuides(cell);
  if(state.showGrid) drawGrid(cell);

  runValidator();
}

/* ---------- painting ---------- */

function isEquipmentSlot(slot){ return slot!=='cuerpo_base' && slot!=='brazos' && slot!=='pelo'; }

function getActiveArrRef(){
  const proj = project();
  if(state.mode==='cosmeticos'){
    if(state.activeLayerKey==='pelo' && proj.hairId==='custom'){
      if(!proj.customHair) proj.customHair = blankLayer();
      return proj.customHair;
    }
    return null; // cosmetics mode doesn't paint equipment directly
  }
  if(!isEquipmentSlot(state.activeLayerKey)) return null;
  if(!proj.layers[state.activeLayerKey]) proj.layers[state.activeLayerKey] = blankLayer();
  return proj.layers[state.activeLayerKey];
}

function pushUndo(){
  const arr = getActiveArrRef();
  if(!arr) return;
  const h = ensureHist();
  h.undo.push(arr.slice());
  if(h.undo.length>60) h.undo.shift();
  h.redo.length = 0;
}

function setPixel(arr,x,y,color){
  if(x<0||x>63||y<0||y>63) return;
  arr[idx(x,y)] = color;
  if(state.mirrorX){
    const mx = 63-x;
    arr[idx(mx,y)] = color;
  }
}

function floodFill(arr,x,y,color){
  if(x<0||x>63||y<0||y>63) return;
  const target = arr[idx(x,y)];
  if(target===color) return;
  const stack=[[x,y]];
  const seen = new Set();
  while(stack.length){
    const [cx,cy]=stack.pop();
    if(cx<0||cx>63||cy<0||cy>63) continue;
    const key=cx+','+cy;
    if(seen.has(key)) continue;
    if(arr[idx(cx,cy)]!==target) continue;
    seen.add(key);
    setPixel(arr,cx,cy,color);
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
}

function lineCells(x0,y0,x1,y1){
  const cells=[];
  let dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0);
  let sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx+dy;
  while(true){
    cells.push([x0,y0]);
    if(x0===x1 && y0===y1) break;
    const e2=2*err;
    if(e2>=dy){ err+=dy; x0+=sx; }
    if(e2<=dx){ err+=dx; y0+=sy; }
  }
  return cells;
}

let painting=false, dragStart=null, previewSnapshot=null;

function canvasToCell(evt){
  const rect = canvas.getBoundingClientRect();
  const cell = currentCell();
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  const x = Math.floor(((evt.clientX-rect.left)*scaleX)/cell);
  const y = Math.floor(((evt.clientY-rect.top)*scaleY)/cell);
  return [x,y];
}

function brushStamp(arr,x,y,color){
  const r = state.brushSize;
  for(let oy=-(r-1); oy<=(r-1); oy++){
    for(let ox=-(r-1); ox<=(r-1); ox++){
      if(r>1 && Math.abs(ox)+Math.abs(oy) > r) continue;
      setPixel(arr,x+ox,y+oy,color);
    }
  }
}

let isRightClickErasing = false;

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousedown',(e)=>{
  const arr = getActiveArrRef();
  if(!arr) return;
  
  if (e.button === 2) isRightClickErasing = true;
  else isRightClickErasing = false;

  const [x,y] = canvasToCell(e);
  painting = true;
  pushUndo();
  
  const drawColor = isRightClickErasing ? null : state.activeColor;

  if(state.tool==='brush'){
    brushStamp(arr,x,y,drawColor);
  } else if(state.tool==='eraser' || (isRightClickErasing && state.tool !== 'fill' && state.tool !== 'eyedrop' && state.tool !== 'line' && state.tool !== 'rect' && state.tool !== 'rectFilled')){
    // fallback if right click during an unhandled tool
    brushStamp(arr,x,y,null);
  } else if(state.tool==='fill'){
    floodFill(arr,x,y,drawColor);
  } else if(state.tool==='eyedrop'){
    const c = arr[idx(x,y)];
    if(c){ state.activeColor=c; syncActiveColorUI(); }
    painting=false;
  } else if(state.tool==='line' || state.tool==='rect' || state.tool==='rectFilled'){
    dragStart=[x,y];
    previewSnapshot = arr.slice();
  }
  render();
});
canvas.addEventListener('mousemove',(e)=>{
  if(!painting) return;
  const arr = getActiveArrRef();
  if(!arr) return;
  const [x,y] = canvasToCell(e);
  const drawColor = isRightClickErasing ? null : state.activeColor;

  if(state.tool==='brush'){
    brushStamp(arr,x,y,drawColor); render();
  } else if(state.tool==='eraser' || (isRightClickErasing && state.tool !== 'line' && state.tool !== 'rect' && state.tool !== 'rectFilled')){
    brushStamp(arr,x,y,null); render();
  } else if((state.tool==='line'||state.tool==='rect'||state.tool==='rectFilled') && dragStart){
    // restore snapshot, draw preview shape
    for(let i=0;i<4096;i++) arr[i]=previewSnapshot[i];
    if(state.tool==='line'){
      for(const [cx,cy] of lineCells(dragStart[0],dragStart[1],x,y)) setPixel(arr,cx,cy,drawColor);
    } else {
      const x0=Math.min(dragStart[0],x), x1=Math.max(dragStart[0],x);
      const y0=Math.min(dragStart[1],y), y1=Math.max(dragStart[1],y);
      for(let yy=y0;yy<=y1;yy++){
        for(let xx=x0;xx<=x1;xx++){
          const border = xx===x0||xx===x1||yy===y0||yy===y1;
          if(state.tool==='rectFilled' || border) setPixel(arr,xx,yy,drawColor);
        }
      }
    }
    render();
  }
});
window.addEventListener('mouseup',()=>{
  if(painting || dragStart) scheduleSave();
  painting=false; dragStart=null; previewSnapshot=null;
});
canvas.addEventListener('mouseleave',()=>{ /* keep painting state for drag tools until mouseup */ });

// touch support for mobile
function touchToCell(evt){
  const touch = evt.touches[0] || evt.changedTouches[0];
  const rect = canvas.getBoundingClientRect();
  const cell = currentCell();
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  const x = Math.floor(((touch.clientX-rect.left)*scaleX)/cell);
  const y = Math.floor(((touch.clientY-rect.top)*scaleY)/cell);
  return [x,y];
}
canvas.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  const arr = getActiveArrRef(); if(!arr) return;
  const [x,y] = touchToCell(e);
  painting = true; isRightClickErasing = false;
  pushUndo();
  if(state.tool==='brush') brushStamp(arr,x,y,state.activeColor);
  else if(state.tool==='eraser') brushStamp(arr,x,y,null);
  else if(state.tool==='fill') floodFill(arr,x,y,state.activeColor);
  else if(state.tool==='eyedrop'){ const c=arr[idx(x,y)]; if(c){state.activeColor=c;syncActiveColorUI();} painting=false; }
  else if(state.tool==='line'||state.tool==='rect'||state.tool==='rectFilled'){ dragStart=[x,y]; previewSnapshot=arr.slice(); }
  render();
}, {passive:false});
canvas.addEventListener('touchmove',(e)=>{
  e.preventDefault();
  if(!painting) return;
  const arr = getActiveArrRef(); if(!arr) return;
  const [x,y] = touchToCell(e);
  if(state.tool==='brush'){ brushStamp(arr,x,y,state.activeColor); render(); }
  else if(state.tool==='eraser'){ brushStamp(arr,x,y,null); render(); }
  else if((state.tool==='line'||state.tool==='rect'||state.tool==='rectFilled')&&dragStart){
    for(let i=0;i<4096;i++) arr[i]=previewSnapshot[i];
    if(state.tool==='line') for(const [cx,cy] of lineCells(dragStart[0],dragStart[1],x,y)) setPixel(arr,cx,cy,state.activeColor);
    else{
      const x0=Math.min(dragStart[0],x),x1=Math.max(dragStart[0],x),y0=Math.min(dragStart[1],y),y1=Math.max(dragStart[1],y);
      for(let yy=y0;yy<=y1;yy++) for(let xx=x0;xx<=x1;xx++){
        if(state.tool==='rectFilled'||xx===x0||xx===x1||yy===y0||yy===y1) setPixel(arr,xx,yy,state.activeColor);
      }
    }
    render();
  }
}, {passive:false});
canvas.addEventListener('touchend',(e)=>{
  if(painting||dragStart) scheduleSave();
  painting=false; dragStart=null; previewSnapshot=null;
});

/* ---------- undo/redo ---------- */

function doUndo(){
  const arr = getActiveArrRef();
  if(!arr) return;
  const h = ensureHist();
  if(!h.undo.length) return;
  h.redo.push(arr.slice());
  const prev = h.undo.pop();
  for(let i=0;i<4096;i++) arr[i]=prev[i];
  render();
}
function doRedo(){
  const arr = getActiveArrRef();
  if(!arr) return;
  const h = ensureHist();
  if(!h.redo.length) return;
  h.undo.push(arr.slice());
  const next = h.redo.pop();
  for(let i=0;i<4096;i++) arr[i]=next[i];
  render();
}

/* ---------- validator ---------- */

function collectProjectColors(proj){
  const set = new Set();
  for(const slot of proj.activeSlots){
    const arr = proj.layers[slot];
    if(!arr) continue;
    for(const c of arr) if(c) set.add(c);
  }
  return [...set];
}

function runValidator(){
  const proj = project();
  const results = [];

  // 1. outline
  const colors = collectProjectColors(proj);
  const nearBlack = colors.filter(c => !CANONICAL_OUTLINE.includes(c) && rgbDist(c,'#000000') < 40);
  if(colors.length===0){
    results.push({status:'warn', title:'Contorno canónico', msg:'Esta clase todavía no tiene píxeles pintados.'});
  } else if(nearBlack.length){
    results.push({status:'fail', title:'Contorno canónico', msg:'Hay negros "casi puros" fuera de la paleta canónica: '+nearBlack.join(', ')+'. Usa #000000.'});
  } else if(colors.includes('#000000') || colors.includes('#17191b')){
    results.push({status:'pass', title:'Contorno canónico', msg:'Contorno #000000 detectado y consistente.'});
  } else {
    results.push({status:'warn', title:'Contorno canónico', msg:'No se detectó contorno negro en ninguna capa. ¿Es intencional?'});
  }

  // 2. palette distance
  const dupPairs = [];
  for(let i=0;i<colors.length;i++){
    for(let j=i+1;j<colors.length;j++){
      const d = rgbDist(colors[i],colors[j]);
      if(d>0 && d<12) dupPairs.push(colors[i]+' ≈ '+colors[j]);
    }
  }
  if(dupPairs.length){
    results.push({status:'warn', title:'Paleta sin duplicados', msg:'Colores casi idénticos (dist<12): '+dupPairs.slice(0,4).join(', ')+(dupPairs.length>4?'…':'')});
  } else {
    results.push({status:'pass', title:'Paleta sin duplicados', msg:colors.length+' colores únicos, todos separados por ≥12 en RGB.'});
  }

  // 3. ramp
  if(!proj.ramp.enabled){
    results.push({status:'warn', title:'Rampa tintable B/C/D', msg:'Rampa opcional no activada — la armadura no podrá re-tintarse en runtime.'});
  } else {
    const {B,C,D} = proj.ramp;
    const ds = [rgbDist(B,C), rgbDist(B,D), rgbDist(C,D)];
    if(ds.some(d=>d<12)){
      results.push({status:'fail', title:'Rampa tintable B/C/D', msg:'Los tonos de la rampa están demasiado cerca entre sí.'});
    } else {
      results.push({status:'pass', title:'Rampa tintable B/C/D', msg:'Rampa completa: oscuro/medio/claro bien diferenciados.'});
    }
  }

  // 4. silhouette collision
  const mask = occupancyMask(proj);
  let maxIoU = 0, maxWith = null;
  for(const otherId of Object.keys(CLASS_ASSETS)){
    if(otherId===proj.classId) continue;
    const other = getOrCreateProject(otherId);
    const omask = occupancyMask(other);
    let inter=0, union=0;
    for(let i=0;i<4096;i++){
      if(mask[i]||omask[i]) union++;
      if(mask[i]&&omask[i]) inter++;
    }
    const iou = union? inter/union : 0;
    if(iou>maxIoU){ maxIoU=iou; maxWith=otherId; }
  }
  if(colors.length===0){
    results.push({status:'warn', title:'Silueta distintiva', msg:'Pinta al menos una capa para comparar siluetas.'});
  } else if(maxIoU>=0.80){
    results.push({status:'fail', title:'Silueta distintiva', msg:'Silueta muy similar a '+(ROSTER_BY_ID[maxWith]?ROSTER_BY_ID[maxWith].name:maxWith)+' ('+Math.round(maxIoU*100)+'% de solape). Diferénciala más.'});
  } else {
    results.push({status:'pass', title:'Silueta distintiva', msg:'Máximo solape detectado: '+Math.round(maxIoU*100)+'% (con '+(ROSTER_BY_ID[maxWith]?ROSTER_BY_ID[maxWith].name:'—')+'). Por debajo del 80%.'});
  }

  renderValidator(results);
}

function renderValidator(results){
  const el = document.getElementById('validatorList');
  if(!el) return;
  el.innerHTML = results.map(r=>`
    <div class="check-row">
      <div class="check-dot ${r.status}"></div>
      <div class="check-body"><b>${r.title}</b><span>${r.msg}</span></div>
    </div>
  `).join('');
}

/* ---------- export ---------- */

function layerToAssetJSON(arr){
  return { current: arr.map(v => v===null ? 'transparent' : v) };
}

function exportActiveLayer(mode){
  const proj = project();
  const arr = proj.layers[state.activeLayerKey];
  if(!arr){ toast('Esta capa está vacía.'); return; }
  const json = layerToAssetJSON(arr);
  const filename = `${proj.classId}_${state.activeLayerKey}.json`;
  if(mode==='copy'){ copyText(JSON.stringify(json)); toast('Capa copiada al portapapeles.'); }
  else { downloadJSON(json, filename); }
}

function bakedComposite(proj){
  const flat = new Array(4096).fill(null);
  for(const slot of effectiveZOrder(proj)){
    const arr = resolveLayer(slot, proj, {});
    if(!arr) continue;
    for(let i=0;i<4096;i++) if(arr[i]) flat[i]=arr[i];
  }
  return flat;
}

const LETTER_POOL = 'BCDEFGHIJKLMNOPQRSTUVWXYZbcdefghijklmnopqrstuvwxyz0123456789'.split('');

function buildBakedExport(proj){
  const flat = bakedComposite(proj);
  const paleta = { ' ':'transparent', 'A':'#000000' };
  const colorToLetter = { '#000000':'A' };
  let pool = LETTER_POOL.slice();

  if(proj.ramp.enabled){
    paleta['B']=proj.ramp.B; colorToLetter[proj.ramp.B]='B';
    paleta['C']=proj.ramp.C; colorToLetter[proj.ramp.C]='C';
    paleta['D']=proj.ramp.D; colorToLetter[proj.ramp.D]='D';
    pool = pool.filter(l=>!['B','C','D'].includes(l));
  }

  let rows=[];
  for(let y=0;y<64;y++){
    let row='';
    for(let x=0;x<64;x++){
      const c = flat[idx(x,y)];
      if(!c){ row+=' '; continue; }
      if(c==='#000000'){ row+='A'; continue; }
      if(!colorToLetter[c]){
        const L = pool.shift();
        if(!L){ row+='?'; continue; }
        colorToLetter[c]=L; paleta[L]=c;
      }
      row+=colorToLetter[c];
    }
    rows.push(row);
  }
  return { name: proj.className, category:'characters', source:'admin_designs', tool:'character', payload:{ paleta, blueprint: rows } };
}

function exportBaked(mode){
  const proj = project();
  const json = buildBakedExport(proj);
  const filename = `${proj.classId}_baked.json`;
  if(mode==='copy'){ copyText(JSON.stringify(json)); toast('JSON Baked copiado.'); }
  else { downloadJSON(json, filename); }
}

function exportFullProject(){
  const proj = project();
  const bundle = {
    classId: proj.classId, className: proj.className, classDesc: proj.classDesc, classSilhouette: proj.classSilhouette,
    ramp: proj.ramp, customSlotLabels: proj.customSlotLabels||{},
    layers: {},
  };
  for(const slot of proj.activeSlots){
    bundle.layers[slot] = layerToAssetJSON(proj.layers[slot] || blankLayer());
  }
  downloadJSON(bundle, `${proj.classId}_proyecto_completo.json`);
}

/* ---------- import ---------- */

function importIntoActiveLayer(text){
  try{
    const flat = parseImportedAsset(text);
    pushUndo();
    const proj = project();
    proj.layers[state.activeLayerKey] = flat;
    render(); renderLayerStrip(); saveDraft();
    toast('Capa importada correctamente.');
  }catch(err){
    toast('No se pudo importar: '+err.message);
  }
}

function importFullProject(text){
  try{
    const bundle = JSON.parse(text);
    const classId = bundle.classId || ('custom_'+Date.now());
    const proj = newProjectFor(classId);
    proj.className = bundle.className || classId;
    proj.classDesc = bundle.classDesc || '';
    proj.classSilhouette = bundle.classSilhouette || '';
    proj.ramp = bundle.ramp || proj.ramp;
    proj.customSlotLabels = bundle.customSlotLabels || {};
    proj.activeSlots = Object.keys(bundle.layers||{});
    proj.layers = {};
    for(const slot of proj.activeSlots){
      proj.layers[slot] = parseImportedAsset(JSON.stringify(bundle.layers[slot]));
    }
    projectsByClassId[classId] = proj;
    state.mode = 'clases';
    state.classId = classId;
    state.editClassId = classId;
    state.activeLayerKey = proj.activeSlots[0] || 'capucha';
    fullRerender();
    toast('Proyecto importado: '+proj.className);
  }catch(err){
    toast('No se pudo importar el proyecto: '+err.message);
  }
}

/* ---------- draft autosave (localStorage) ---------- */

function serializeAll(){
  const out = { classId: state.classId, editClassId: state.editClassId, cosmeticClassId: state.cosmeticClassId, projects:{} };
  for(const cid of Object.keys(projectsByClassId)){
    const p = projectsByClassId[cid];
    out.projects[cid] = {
      classId:p.classId, className:p.className, classDesc:p.classDesc, classSilhouette:p.classSilhouette,
      ramp:p.ramp, activeSlots:p.activeSlots,
      customSlotLabels: p.customSlotLabels||{}, hiddenSlots: p.hiddenSlots||[],
      gender: p.gender, armPose: p.armPose, hairId: p.hairId,
      customHair: p.customHair ? p.customHair.map(v=>v||'') : null,
      layers: Object.fromEntries(p.activeSlots.map(s=>[s, (p.layers[s]||blankLayer()).map(v=>v||'')])),
    };
  }
  return out;
}

function saveDraft(){
  try{
    const data = JSON.stringify(serializeAll());
    localStorage.setItem('taskoria_forja_draft', data);
    setDraftStatus(true);
  }catch(e){
    console.warn('Forja: saveDraft failed', e.name, e.message);
    setDraftStatus(false);
  }
}
function setDraftStatus(ok){
  const dot = document.getElementById('draftDot');
  const label = document.getElementById('draftLabel');
  if(!dot) return;
  dot.style.background = ok ? 'var(--ok)' : 'var(--muted-2)';
  label.textContent = ok ? 'sesión guardada' : 'sin guardar';
}

function loadWorkspaceData(data) {
  try{
    for(const cid of Object.keys(data.projects||{})){
      const d = data.projects[cid];
      const p = newProjectFor(cid);
      p.className=d.className; p.classDesc=d.classDesc; p.classSilhouette=d.classSilhouette;
      p.ramp=d.ramp; p.activeSlots=d.activeSlots;
      p.customSlotLabels = d.customSlotLabels || {};
      p.hiddenSlots = d.hiddenSlots || [];
      p.gender = d.gender || data.gender || 'male';
      p.armPose = d.armPose || data.armPose || 'relajados';
      p.hairId = d.hairId || data.hairId || 'pelo_m1';
      p.customHair = d.customHair ? d.customHair.map(v=>v||null) : (data.customHair ? data.customHair.map(v=>v||null) : null);
      p.layers = {};
      for(const s of d.activeSlots) p.layers[s] = d.layers[s].map(v=>v||null);
      projectsByClassId[cid]=p;
    }
    state.classId = data.classId || state.classId;
    state.editClassId = data.editClassId || data.classId || state.editClassId;
    state.cosmeticClassId = data.cosmeticClassId || state.cosmeticClassId;
    return true;
  }catch(e){ return false; }
}

function loadDraft(){
  try{
    const raw = localStorage.getItem('taskoria_forja_draft');
    if(!raw) return false;
    return loadWorkspaceData(JSON.parse(raw));
  }catch(e){ return false; }
}

let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveDraft, 400); }

function slugifySlotName(name){
  let slug = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  if(!slug) slug = 'capa_'+Date.now().toString(36);
  return slug;
}

function renderLayerStrip(){
  const el = document.getElementById('layerstrip');
  if(state.mode!=='clases'){ el.innerHTML=''; return; }
  const proj = project();
  proj.hiddenSlots = proj.hiddenSlots || [];
  const chips = proj.activeSlots.map(slot=>{
    const has = proj.layers[slot] && proj.layers[slot].some(v=>v);
    const hidden = proj.hiddenSlots.includes(slot);
    return `<div class="layer-chip ${state.activeLayerKey===slot?'active':''} ${has?'has-content':''} ${hidden?'layer-hidden':''}" data-slot="${slot}">
      <button class="layer-vis-btn" data-visslot="${slot}" title="${hidden?'Mostrar capa':'Ocultar capa'}">${hidden?ICON_EYE_CLOSED:ICON_EYE_OPEN}</button>
      <span class="swatch-mini"></span>${slotLabel(proj,slot)}
    </div>`;
  }).join('');
  const addBtn = `<div class="layer-chip add-slot" id="btnAddSlot">+ añadir capa</div>`;
  el.innerHTML = `<span class="layerstrip-label">Capas</span>${chips}${addBtn}`;
  el.querySelectorAll('[data-slot]').forEach(chip=>{
    chip.onclick = ()=>{ state.activeLayerKey = chip.dataset.slot; renderAll(); };
  });
  el.querySelectorAll('[data-visslot]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const slot = btn.dataset.visslot;
      const i = proj.hiddenSlots.indexOf(slot);
      if(i>=0) proj.hiddenSlots.splice(i,1); else proj.hiddenSlots.push(slot);
      renderLayerStrip(); render(); scheduleSave();
    };
  });
  const addEl = document.getElementById('btnAddSlot');
  if(addEl){
    addEl.onclick = ()=>{
      const presets = EXTRA_SLOTS.filter(s=>!proj.activeSlots.includes(s)).map(s=>SLOT_DEFS[s].label);
      const hint = presets.length ? ` (o una predefinida: ${presets.join(', ')})` : '';
      const input = prompt('Nombre de la nueva capa'+hint+':');
      if(!input) return;
      const trimmed = input.trim();
      if(!trimmed) return;
      const knownMatch = EXTRA_SLOTS.find(s => !proj.activeSlots.includes(s) && (SLOT_DEFS[s].label.toLowerCase()===trimmed.toLowerCase() || s===trimmed.toLowerCase()));
      let slot;
      if(knownMatch){
        slot = knownMatch;
      } else {
        slot = slugifySlotName(trimmed);
        let unique = slot, n = 2;
        while(proj.activeSlots.includes(unique)){ unique = slot+'_'+n; n++; }
        slot = unique;
        proj.customSlotLabels = proj.customSlotLabels || {};
        proj.customSlotLabels[slot] = trimmed;
      }
      if(proj.activeSlots.includes(slot)){ toast('Esa capa ya existe.'); return; }
      proj.activeSlots.push(slot);
      proj.layers[slot] = blankLayer();
      state.activeLayerKey = slot;
      renderAll(); scheduleSave();
    };
  }
}

/* ---------- publish to API ---------- */

function getModifiedClassIds(){
  const ids = [];
  for(const cid of Object.keys(projectsByClassId)){
    if(isClassModified(cid)) ids.push(cid);
  }
  return ids;
}

function buildPublishPayload(){
  const classIds = getModifiedClassIds();
  return classIds.map(cid => {
    const proj = projectsByClassId[cid];
    const baked = buildBakedExport(proj);
    const projectData = {
      classId: proj.classId, className: proj.className, classDesc: proj.classDesc,
      classSilhouette: proj.classSilhouette, ramp: proj.ramp,
      activeSlots: proj.activeSlots, customSlotLabels: proj.customSlotLabels || {},
      gender: proj.gender, armPose: proj.armPose, hairId: proj.hairId,
      layers: Object.fromEntries(proj.activeSlots.map(s => [s, layerToAssetJSON(proj.layers[s] || blankLayer())])),
    };
    return {
      class_id: cid,
      class_name: proj.className,
      class_desc: proj.classDesc,
      class_silhouette: proj.classSilhouette,
      baked_payload: baked.payload || baked,
      project_data: projectData,
    };
  });
}

async function publishToAPI(){
  const adminId = getAdminId();
  if(!adminId){
    toast('Introduce tu Admin ID en la barra superior.');
    document.getElementById('cfgAdminId')?.focus();
    return;
  }
  localStorage.setItem('forja_admin_id', adminId);

  const classes = buildPublishPayload();
  if(classes.length === 0){
    toast('No hay clases modificadas para publicar.');
    return;
  }

  const btn = document.getElementById('btnPublish');
  btn.disabled = true;
  btn.classList.add('publishing');
  btn.innerHTML = '&#9650; Publicando...';

  try{
    const res = await fetch(API_BASE + '/class_blueprints.php?action=publish', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ admin_id: parseInt(adminId), classes }),
    });
    const data = await res.json();
    if(data.error){
      toast('Error: ' + data.error);
    } else {
      const ok = (data.results||[]).filter(r=>r.success).length;
      const fail = (data.results||[]).filter(r=>r.error).length;
      toast(ok + ' clase' + (ok!==1?'s':'') + ' publicada' + (ok!==1?'s':'') + (fail ? ' ('+fail+' con error)' : '') + ' en producción.');
    }
  } catch(e) {
    toast('Error de conexión: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.classList.remove('publishing');
    btn.innerHTML = '&#9650; Publicar';
  }
}

/* ---------- load workspace from API ---------- */

async function loadWorkspaceFromAPI(adminId){
  try{
    const res = await fetch(API_BASE + '/class_blueprints.php?action=load_workspace', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ admin_id: parseInt(adminId) }),
    });
    const data = await res.json();
    if(data.error || !data.classes || data.classes.length===0) return false;

    let loaded = 0;
    for(const cls of data.classes){
      if(!cls.project_data) continue;
      const pd = cls.project_data;
      const cid = pd.classId || cls.class_id;
      const p = newProjectFor(cid);
      p.className = pd.className || cls.class_name || cid;
      p.classDesc = pd.classDesc || cls.class_desc || '';
      p.classSilhouette = pd.classSilhouette || cls.class_silhouette || '';
      p.ramp = pd.ramp || p.ramp;
      p.activeSlots = pd.activeSlots || p.activeSlots;
      p.customSlotLabels = pd.customSlotLabels || {};
      p.hiddenSlots = pd.hiddenSlots || [];
      p.gender = pd.gender || 'male';
      p.armPose = pd.armPose || 'relajados';
      p.hairId = pd.hairId || 'pelo_m1';
      p.customHair = pd.customHair ? pd.customHair.map(v=>v||null) : null;
      if(pd.layers){
        p.layers = {};
        for(const s of p.activeSlots){
          if(pd.layers[s]) p.layers[s] = pd.layers[s].map(v=>v||null);
          else p.layers[s] = blankLayer();
        }
      }
      projectsByClassId[cid] = p;
      loaded++;
    }
    if(loaded>0){
      state.classId = data.classes[0].class_id || state.classId;
      state.editClassId = state.classId;
      return true;
    }
    return false;
  }catch(e){
    console.warn('Forja: loadWorkspaceFromAPI failed', e);
    return false;
  }
}

/* ---------- init ---------- */

(async function init(){
  // restore admin ID from localStorage
  const savedAdminId = localStorage.getItem('forja_admin_id');
  if(savedAdminId){
    const el = document.getElementById('cfgAdminId');
    if(el) el.value = savedAdminId;
  }

  // try loading from API first (server-persisted data), then fall back to localStorage draft
  let restored = false;
  if(savedAdminId){
    restored = await loadWorkspaceFromAPI(savedAdminId);
    if(restored) toast('Datos cargados del servidor.');
  }
  if(!restored){
    restored = loadDraft();
    if(restored) toast('Borrador local restaurado.');
  }

  // wire topbar buttons
  document.getElementById('btnSaveSession').onclick = ()=>{
    saveDraft();
    toast('Sesión guardada correctamente.');
  };
  document.getElementById('btnPublish').onclick = publishToAPI;
  document.getElementById('cfgAdminId').onchange = (e)=>{
    localStorage.setItem('forja_admin_id', e.target.value.trim());
  };

  const proj = project();
  state.activeLayerKey = proj.activeSlots[0] || 'capucha';
  renderAll();

  // ---- Mobile panel switching ----
  const isMobile = ()=> window.innerWidth <= 640;
  let activePanel = 'canvas';

  function closeMobilePanels(){
    document.querySelectorAll('.mobile-panel').forEach(p=>p.classList.remove('open'));
  }
  function openMobilePanel(panelId){
    closeMobilePanels();
    const el = document.getElementById(panelId);
    if(el){
      el.classList.add('open');
      // populate content
      if(panelId==='mobileRoster') populateMobileRoster();
      if(panelId==='mobilePalette') populateMobilePalette();
      if(panelId==='mobileTools') populateMobileTools();
    }
  }

  function populateMobileRoster(){
    const el = document.getElementById('mobileRoster');
    const proj2 = project();
    if(state.mode==='clases'){
      el.innerHTML = `<div class="rail-section"><h3>Roster de clases</h3><div id="mRosterList"></div></div>`;
      const list = document.getElementById('mRosterList');
      list.innerHTML = ROSTER.map(r=>{
        const isBuilt = isClassModified(r.id);
        return `<div class="roster-card ${state.classId===r.id?'active':''}" data-id="${r.id}">
          <div class="roster-top"><span class="roster-name">${r.name}</span>
          <span class="chip ${isBuilt?'chip-built':'chip-pending'}">${isBuilt?'Construida':'Pendiente'}</span></div>
          <span class="roster-silhouette">${r.silhouette}</span></div>`;
      }).join('');
      list.querySelectorAll('.roster-card').forEach(card=>{
        card.onclick = ()=>{
          if(state.classId===card.dataset.id) return;
          state.classId=card.dataset.id; state.editClassId=card.dataset.id;
          const p=getOrCreateProject(state.classId);
          if(!p.activeSlots.includes(state.activeLayerKey)) state.activeLayerKey=p.activeSlots[0]||'capucha';
          closeMobilePanels(); activePanel='canvas';
          document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel==='canvas'));
          fullRerender();
        };
      });
    } else {
      el.innerHTML = document.getElementById('railLeft').innerHTML;
    }
  }

  function populateMobilePalette(){
    const el = document.getElementById('mobilePalette');
    const proj2 = project();
    el.innerHTML = `
      <div class="rail-section">
        <h3>Color activo</h3>
        <div class="active-color-row">
          <div class="active-color-swatch"><div class="fill" id="mActiveColorFill" style="background:${state.activeColor}"></div></div>
          <div class="color-input-row" style="flex:1;">
            <input type="text" id="mActiveColorHex" value="${state.activeColor}" style="font-family:var(--font-mono);"/>
            <input type="color" id="mActiveColorPicker" value="${state.activeColor}"/>
          </div>
        </div>
        <div class="swatch-grid" id="mSwatchGrid"></div>
      </div>
      <div class="rail-section">
        <h3>Colores de la clase</h3>
        <div class="swatch-grid" id="mClassColors"></div>
      </div>
      <div class="rail-section">
        <h3>Rampa tintable (B/C/D)</h3>
        <label style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
          <input type="checkbox" id="mRampEnabled" ${proj2.ramp.enabled?'checked':''}/> Activar rampa
        </label>
        <div class="ramp-row">
          <div class="ramp-swatch"><span>B</span><input type="color" id="mRampB" value="${proj2.ramp.B}"/></div>
          <div class="ramp-swatch"><span>C</span><input type="color" id="mRampC" value="${proj2.ramp.C}"/></div>
          <div class="ramp-swatch"><span>D</span><input type="color" id="mRampD" value="${proj2.ramp.D}"/></div>
        </div>
      </div>
      <div class="rail-section">
        <h3>Validador</h3>
        <div id="mValidatorList"></div>
      </div>`;

    // swatches
    const grid = document.getElementById('mSwatchGrid');
    grid.innerHTML = DEFAULT_PALETTE.map(c=>`<div class="swatch ${state.activeColor===c?'selected':''}" style="background:${c}" data-c="${c}"></div>`).join('');
    grid.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>{
      state.activeColor=s.dataset.c; syncActiveColorUI(); populateMobilePalette();
    });

    const cc = document.getElementById('mClassColors');
    const classColors = collectProjectColors(proj2);
    cc.innerHTML = classColors.length ? classColors.map(c=>`<div class="swatch ${state.activeColor===c?'selected':''}" style="background:${c}" data-c="${c}"></div>`).join('') : '<span class="rail-hint" style="display:block;">Sin píxeles</span>';
    cc.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>{
      state.activeColor=s.dataset.c; syncActiveColorUI(); populateMobilePalette();
    });

    // hex/picker
    document.getElementById('mActiveColorHex').onchange = (e)=>{ state.activeColor=e.target.value.toLowerCase(); syncActiveColorUI(); };
    document.getElementById('mActiveColorPicker').oninput = (e)=>{ state.activeColor=e.target.value.toLowerCase(); syncActiveColorUI(); };

    // ramp
    document.getElementById('mRampEnabled').onchange = (e)=>{ proj2.ramp.enabled=e.target.checked; render(); scheduleSave(); };
    document.getElementById('mRampB').oninput = (e)=>{ proj2.ramp.B=e.target.value.toLowerCase(); scheduleSave(); };
    document.getElementById('mRampC').oninput = (e)=>{ proj2.ramp.C=e.target.value.toLowerCase(); scheduleSave(); };
    document.getElementById('mRampD').oninput = (e)=>{ proj2.ramp.D=e.target.value.toLowerCase(); scheduleSave(); };

    // validator
    runValidator();
    const vl = document.getElementById('validatorList');
    if(vl) document.getElementById('mValidatorList').innerHTML = vl.innerHTML;
  }

  function populateMobileTools(){
    const el = document.getElementById('mobileTools');
    const proj2 = project();
    el.innerHTML = `
      <div class="rail-section">
        <h3>Vista</h3>
        <label style="display:flex;align-items:center;gap:8px;padding:8px 0;">
          <input type="checkbox" id="mChkGrid" ${state.showGrid?'checked':''} style="width:18px;height:18px;accent-color:var(--accent);"/> Cuadrícula
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:8px 0;">
          <input type="checkbox" id="mChkBBox" ${state.showBBox?'checked':''} style="width:18px;height:18px;accent-color:var(--accent);"/> Guía de proporciones
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:8px 0;">
          Zoom: <input type="range" id="mRngZoom" min="4" max="16" step="1" value="${state.zoom}" style="flex:1;accent-color:var(--accent);"/>
          <span style="font-family:var(--font-mono);width:24px;text-align:center;">${state.zoom}</span>
        </label>
      </div>
      <div class="rail-section">
        <h3>Calco y referencia</h3>
        <label style="display:flex;align-items:center;gap:8px;padding:8px 0;">
          <input type="checkbox" id="mChkCalco" ${state.calco.on?'checked':''} style="width:18px;height:18px;accent-color:var(--accent);"/> Modo calco
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:8px 0;">
          Opacidad: <input type="range" id="mRngCalco" min="0.05" max="0.8" step="0.05" value="${state.calco.opacity}" style="flex:1;accent-color:var(--accent);" ${state.calco.on?'':'disabled'}/>
        </label>
        <label style="display:flex;align-items:center;gap:8px;padding:8px 0;">
          <input type="checkbox" id="mChkGhost" ${state.ghost.on?'checked':''} style="width:18px;height:18px;accent-color:var(--accent);"/> Referencia fantasma
        </label>
        <select id="mGhostSelect" ${state.ghost.on?'':'disabled'}>
          ${Object.keys(CLASS_ASSETS).map(id=>`<option value="${id}" ${state.ghost.refClassId===id?'selected':''}>${ROSTER_BY_ID[id].name}</option>`).join('')}
        </select>
      </div>
      <div class="rail-section">
        <h3>Cuerpo base</h3>
        <select id="mQcGender"><option value="male" ${proj2.gender==='male'?'selected':''}>Chico</option><option value="female" ${proj2.gender==='female'?'selected':''}>Chica</option></select>
        <label class="field-label" style="margin-top:10px;">Brazos</label>
        <select id="mQcArms">${Object.keys(ARM_ASSET_MAP).map(k=>`<option value="${k}" ${proj2.armPose===k?'selected':''}>${ARM_LABELS[k]}</option>`).join('')}</select>
        <label class="field-label" style="margin-top:10px;">Cabello</label>
        <select id="mQcHair">
          <option value="ninguno" ${proj2.hairId==='ninguno'?'selected':''}>Ninguno</option>
          ${Object.keys(HAIR_ASSET_MAP).map(k=>`<option value="${k}" ${proj2.hairId===k?'selected':''}>${HAIR_LABELS[k]}</option>`).join('')}
          <option value="custom" ${proj2.hairId==='custom'?'selected':''}>Personalizado</option>
        </select>
      </div>`;

    document.getElementById('mChkGrid').onchange = (e)=>{ state.showGrid=e.target.checked; render(); };
    document.getElementById('mChkBBox').onchange = (e)=>{ state.showBBox=e.target.checked; render(); };
    document.getElementById('mRngZoom').oninput = (e)=>{ state.zoom=parseInt(e.target.value); render(); e.target.nextElementSibling.textContent=state.zoom; };
    document.getElementById('mChkCalco').onchange = (e)=>{ state.calco.on=e.target.checked; render(); populateMobileTools(); };
    document.getElementById('mRngCalco').oninput = (e)=>{ state.calco.opacity=parseFloat(e.target.value); render(); };
    document.getElementById('mChkGhost').onchange = (e)=>{ state.ghost.on=e.target.checked; render(); populateMobileTools(); };
    document.getElementById('mGhostSelect').onchange = (e)=>{ state.ghost.refClassId=e.target.value; render(); };
    document.getElementById('mQcGender').onchange = (e)=>{ proj2.gender=e.target.value; render(); scheduleSave(); };
    document.getElementById('mQcArms').onchange = (e)=>{ proj2.armPose=e.target.value; render(); scheduleSave(); };
    document.getElementById('mQcHair').onchange = (e)=>{
      proj2.hairId=e.target.value;
      if(proj2.hairId==='custom'&&!proj2.customHair) proj2.customHair=blankLayer();
      renderToolbar(); render(); scheduleSave();
    };
  }

  // bottom nav clicks
  document.querySelectorAll('.bnav-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const panel = btn.dataset.panel;
      document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');

      if(panel==='canvas' || panel===activePanel){
        closeMobilePanels();
        activePanel = panel==='canvas' ? 'canvas' : (activePanel===panel ? 'canvas' : panel);
        if(activePanel==='canvas') document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel==='canvas'));
        return;
      }
      activePanel = panel;
      const map = {roster:'mobileRoster', palette:'mobilePalette', tools:'mobileTools'};
      openMobilePanel(map[panel]);
    };
  });

  // settings drawer
  const settingsDrawer = document.getElementById('settingsDrawer');
  const settingsOverlay = document.getElementById('settingsOverlay');
  function openSettings(){
    settingsDrawer.classList.add('open');
    settingsOverlay.classList.add('open');
    // sync admin ID
    const mainId = document.getElementById('cfgAdminId');
    const drawerId = document.getElementById('cfgAdminIdDrawer');
    if(mainId && drawerId) drawerId.value = mainId.value;
    // sync mode tabs
    document.getElementById('drawerTabClases').classList.toggle('active', state.mode==='clases');
    document.getElementById('drawerTabCosmeticos').classList.toggle('active', state.mode==='cosmeticos');
  }
  function closeSettings(){
    settingsDrawer.classList.remove('open');
    settingsOverlay.classList.remove('open');
  }
  document.getElementById('btnSettings').onclick = openSettings;
  document.getElementById('btnCloseSettings').onclick = closeSettings;
  settingsOverlay.onclick = closeSettings;

  // drawer admin ID sync
  document.getElementById('cfgAdminIdDrawer').onchange = (e)=>{
    const v = e.target.value.trim();
    const mainEl = document.getElementById('cfgAdminId');
    if(mainEl) mainEl.value = v;
    localStorage.setItem('forja_admin_id', v);
  };

  // drawer new project
  document.getElementById('btnNewProjectDrawer').onclick = ()=>{
    closeSettings();
    document.getElementById('btnNewProject').click();
  };

  // drawer mode tabs
  document.getElementById('drawerTabClases').onclick = ()=>{
    closeSettings();
    document.getElementById('tab-clases').click();
  };
  document.getElementById('drawerTabCosmeticos').onclick = ()=>{
    closeSettings();
    document.getElementById('tab-cosmeticos').click();
  };

  // drawer export
  document.getElementById('btnExpProjectDrawer').onclick = ()=> exportFullProject();
  document.getElementById('btnImportLayerDrawer').onclick = ()=>{
    const text = document.getElementById('importTextDrawer').value.trim();
    if(!text){ toast('Pega un JSON primero.'); return; }
    importIntoActiveLayer(text);
  };
  document.getElementById('importFileDrawer').onchange = (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>importIntoActiveLayer(reader.result);
    reader.readAsText(f);
  };
  document.getElementById('importProjectFileDrawer').onchange = (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{ importFullProject(reader.result); closeSettings(); };
    reader.readAsText(f);
  };

  // auto-fit zoom on mobile
  function autoZoom(){
    if(!isMobile()) return;
    const canvasArea = document.querySelector('.canvas-area');
    if(!canvasArea) return;
    const w = canvasArea.clientWidth - 16;
    const fit = Math.max(4, Math.min(16, Math.floor(w / 64)));
    if(fit !== state.zoom){ state.zoom = fit; render(); }
  }
  autoZoom();
  window.addEventListener('resize', ()=>{ autoZoom(); });
})();

</script>
